[project]
name = "invoice-extraction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "httpx>=0.28.1",
    "langgraph>=1.0",
    "presidio-analyzer>=2.2.366",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extraction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "invoice_extraction"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
    "invoice_extraction.entrypoints",
    "invoice_extraction.composition",
    "invoice_extraction.adapters",
    "invoice_extraction.application",
    "invoice_extraction.domain",
]

[[tool.importlinter.contracts]]
name = "Core stays free of infrastructure libraries"
type = "forbidden"
source_modules = ["invoice_extraction.domain", "invoice_extraction.application"]
forbidden_modules = ["pypdf", "google", "boto3", "botocore", "fastapi", "presidio_analyzer", "spacy"]
allow_indirect_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored third-party skills are not ours to lint
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_extraction", "support"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "kaggle>=2.2.5",
    "moto[dynamodb,s3,sqs]>=5.2.5",
    "pytest>=9.2.0",
]
