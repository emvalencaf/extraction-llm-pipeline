name: CI

on:
  pull_request:
    branches: [development, master]

# Public-repo hardening: read-only token, no `secrets.*` anywhere in this file (fork PRs get
# none), `pull_request` (never `pull_request_target`) so fork code never runs with write
# access, third-party actions pinned to a commit SHA. The compose tests run against
# fake-gemini, so no Gemini key is needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-target:
    name: PR target
    runs-on: ubuntu-latest
    steps:
      - name: Only development may target master
        if: github.base_ref == 'master' && github.head_ref != 'development'
        run: |
          echo "::error::PRs into master must come from development (see CONTRIBUTING.md)"
          exit 1

  checks:
    name: Unicode, ruff, wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Unicode
        run: git ls-files -z | xargs -0 uv run scripts/check_unicode.py
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Wiki bundle
        run: |
          if [ -d .wiki ]; then
            uv run .agents/skills/wiki-okf-validate/scripts/okf_validate.py .wiki --strict
          fi

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run pytest

  failure-injection:
    name: Failure injection (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Run the 11 scenarios on the local stack
        run: make test-compose

  architecture:
    name: Import layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run lint-imports

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra, infra/bootstrap]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.10.5"
      - name: Format
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive
      - name: Init without a backend
        run: terraform -chdir=${{ matrix.dir }} init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=${{ matrix.dir }} validate

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate commit format
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -n1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::commit $sha does not follow CONTRIBUTING.md"
              status=1
            fi
          done
          exit $status
